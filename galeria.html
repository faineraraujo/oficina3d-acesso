<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Acervo | Oficina 3D</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --color-brand-orange:#ff6b00;
    --color-brand-orange-hover:#e56000;
    --color-dark-deep:#050505;
    --color-dark-panel:#0d0d0d;
    --color-dark-border:#2e2e2e;
    --color-text-primary:#fff;
    --color-text-secondary:#a1a1aa;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:var(--color-dark-deep);color:var(--color-text-primary);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    display:flex;flex-direction:column;min-height:100vh;
  }
  a,button{color:inherit;text-decoration:none;font-family:inherit;}
  header.top{
    width:100%;padding:1.1rem 1.5rem;display:flex;align-items:center;gap:1rem;
    border-bottom:1px solid var(--color-dark-border);
  }
  .back-link{font-size:.8rem;font-weight:600;color:var(--color-text-secondary);display:inline-flex;align-items:center;gap:.4rem;background:none;border:none;cursor:pointer;padding:0;}
  .back-link:hover{color:#fff;}
  .back-link svg{width:1rem;height:1rem;}
  header.top .brand-name{font-family:'Montserrat',sans-serif;font-weight:900;font-size:.95rem;color:#fff;text-transform:uppercase;margin-left:auto;}
  header.top .brand-name span{color:var(--color-brand-orange);}

  main{flex:1;width:100%;max-width:72rem;margin:2rem auto;padding:0 1.5rem 3rem;}
  .breadcrumb{font-size:.75rem;color:var(--color-text-secondary);margin:0 0 .5rem;display:flex;flex-wrap:wrap;gap:.35rem;}
  .breadcrumb button{color:var(--color-text-secondary);background:none;border:none;cursor:pointer;font-size:.75rem;padding:0;}
  .breadcrumb button:hover{color:var(--color-brand-orange);}
  .breadcrumb span.sep{color:var(--color-dark-border);}
  .breadcrumb span.current{color:#fff;font-weight:700;}

  .page-title{font-family:'Montserrat',sans-serif;font-weight:900;font-size:1.5rem;margin:.3rem 0;}
  .page-sub{color:var(--color-text-secondary);font-size:.85rem;margin:0 0 2rem;}

  .grid{display:grid;grid-template-columns:1fr;gap:1.25rem;}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
  @media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr);}}

  .card{
    background:#141414;border:1px solid var(--color-dark-border);border-radius:1rem;overflow:hidden;
    display:flex;flex-direction:column;transition:border-color .2s,transform .2s;cursor:pointer;
  }
  .card:hover{border-color:rgba(255,107,0,.45);transform:translateY(-2px);}
  .card-media{
    position:relative;aspect-ratio:1/1;overflow:hidden;
    background:radial-gradient(circle at 30% 20%,#1c1c1c,#050505 75%);
    display:flex;align-items:center;justify-content:center;
  }
  .card-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-media .folder-icon{width:2.5rem;height:2.5rem;color:var(--color-brand-orange);opacity:.55;}
  .card-body{padding:1rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.6rem;flex:1;}
  .card-body h3{font-size:.85rem;font-weight:800;letter-spacing:.03em;color:#fff;margin:0;text-transform:uppercase;}
  .card-meta{font-size:.7rem;color:var(--color-text-secondary);}
  .card-go{
    margin-top:auto;display:flex;align-items:center;justify-content:center;gap:.5rem;
    background:var(--color-brand-orange);color:#fff;font-weight:800;font-size:.78rem;
    text-transform:uppercase;letter-spacing:.03em;border-radius:.6rem;padding:.7rem .9rem;
    transition:background .15s;border:none;width:100%;cursor:pointer;
  }
  .card-go:hover{background:var(--color-brand-orange-hover);}
  .card-go.alt{background:transparent;border:1px solid rgba(255,107,0,.5);color:var(--color-brand-orange);}
  .card-go.alt:hover{background:rgba(255,107,0,.1);}
  .card-go svg{width:1rem;height:1rem;flex-shrink:0;}
  .file-size{font-weight:400;opacity:.75;margin-left:.2rem;}

  .empty{color:var(--color-text-secondary);font-size:.85rem;padding:2rem 0;text-align:center;}

  footer{padding:1.5rem;text-align:center;color:var(--color-text-secondary);font-size:.7rem;}
</style>
</head>
<body>

<header class="top">
  <button class="back-link" id="btnVoltar" type="button">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    Voltar
  </button>
  <div class="brand-name">OFICINA <span>3D</span></div>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <h1 class="page-title" id="pageTitle">Carregando…</h1>
  <p class="page-sub" id="pageSub"></p>
  <div class="grid" id="grid"></div>
</main>

<footer>© 2026 OFICINA 3D™ · Todos os direitos reservados.</footer>

<script>
  var FOLDER_ICON = '<svg class="folder-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>';
  var DOWNLOAD_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>';

  var params = new URLSearchParams(location.search);
  var dataUrl = params.get('data');   // ex: downloads/2026/manifest.json
  var baseDir = dataUrl ? dataUrl.replace(/manifest\.json$/, '') : '';
  var backHref = params.get('voltar') || './categoria-acervo.html';

  var root = null;
  var pathStack = []; // pilha de nós (do root até o atual)

  document.getElementById('btnVoltar').addEventListener('click', function(){
    if (pathStack.length > 1) {
      pathStack.pop();
      render();
    } else {
      location.href = backHref;
    }
  });

  if (!dataUrl) {
    document.getElementById('pageTitle').textContent = 'Nada pra mostrar';
    document.getElementById('pageSub').textContent = 'Nenhum manifest foi informado (?data=...).';
  } else {
    fetch(dataUrl).then(function(r){ return r.json(); }).then(function(json){
      root = json;
      pathStack = [root];
      render();
    }).catch(function(err){
      document.getElementById('pageTitle').textContent = 'Erro ao carregar';
      document.getElementById('pageSub').textContent = String(err);
    });
  }

  function render(){
    var node = pathStack[pathStack.length - 1];
    document.getElementById('pageTitle').textContent = node.name;

    var totalFiles = node.files.length;
    var totalFolders = node.folders.length;
    var parts = [];
    if (totalFolders) parts.push(totalFolders + (totalFolders === 1 ? ' subcategoria' : ' subcategorias'));
    if (totalFiles) parts.push(totalFiles + (totalFiles === 1 ? ' arquivo' : ' arquivos'));
    document.getElementById('pageSub').textContent = parts.length ? parts.join(' · ') : 'Vazio';

    renderBreadcrumb();
    renderGrid(node);
  }

  function renderBreadcrumb(){
    var el = document.getElementById('breadcrumb');
    el.innerHTML = '';
    pathStack.forEach(function(node, i){
      if (i > 0) {
        var sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '/';
        el.appendChild(sep);
      }
      if (i === pathStack.length - 1) {
        var cur = document.createElement('span');
        cur.className = 'current';
        cur.textContent = node.name;
        el.appendChild(cur);
      } else {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = node.name;
        btn.addEventListener('click', function(){
          pathStack = pathStack.slice(0, i + 1);
          render();
        });
        el.appendChild(btn);
      }
    });
  }

  function renderGrid(node){
    var grid = document.getElementById('grid');
    grid.innerHTML = '';

    if (!node.folders.length && !node.files.length) {
      grid.innerHTML = '<p class="empty">Nada por aqui ainda.</p>';
      return;
    }

    node.folders.forEach(function(folder){
      var card = document.createElement('div');
      card.className = 'card';

      var media = document.createElement('div');
      media.className = 'card-media';
      if (folder.cover) {
        media.innerHTML = '<img src="' + baseDir + encodeURI(folder.cover) + '" alt="' + escapeHtml(folder.name) + '" loading="lazy">';
      } else {
        media.innerHTML = FOLDER_ICON;
      }

      var count = countAll(folder);
      var body = document.createElement('div');
      body.className = 'card-body';
      body.innerHTML =
        '<h3>' + escapeHtml(folder.name) + '</h3>' +
        '<span class="card-meta">' + count + (count === 1 ? ' item' : ' itens') + '</span>' +
        '<button type="button" class="card-go">' + FOLDER_ICON.replace('folder-icon', 'card-go-icon') + ' Ver →</button>';

      card.appendChild(media);
      card.appendChild(body);
      card.addEventListener('click', function(){
        pathStack.push(folder);
        render();
      });
      grid.appendChild(card);
    });

    node.files.forEach(function(file){
      var card = document.createElement('div');
      card.className = 'card';

      var media = document.createElement('div');
      media.className = 'card-media';
      media.innerHTML = FOLDER_ICON.replace('folder-icon', 'folder-icon').replace('viewBox="0 0 24 24"', 'viewBox="0 0 24 24"');
      // usa um icone generico de arquivo
      media.innerHTML = '<svg class="folder-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>';

      var body = document.createElement('div');
      body.className = 'card-body';
      body.innerHTML =
        '<h3>' + escapeHtml(file.label) + '</h3>' +
        '<span class="card-meta">' + file.ext.replace('.', '').toUpperCase() + ' <span class="file-size">' + file.size + '</span></span>' +
        '<a class="card-go" href="' + baseDir + encodeURI(file.rel) + '" download>' + DOWNLOAD_ICON + ' Baixar</a>';

      card.appendChild(media);
      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  function countAll(node){
    var c = node.files.length;
    node.folders.forEach(function(f){ c += countAll(f); });
    return c;
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
</script>

</body>
</html>
